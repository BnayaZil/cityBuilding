name: Sync City Blueprint

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CityBlueprint
        run: cargo run -p city-building-cli -- scan --path . --out blueprint.json

      - name: Validate required secrets
        env:
          CITY_API_KEY: ${{ secrets.CITY_API_KEY }}
          WORLD_SERVER_URL: ${{ secrets.WORLD_SERVER_URL }}
          CITY_ID: ${{ secrets.CITY_ID }}
        run: |
          test -n "$CITY_API_KEY" || (echo "CITY_API_KEY is required" && exit 1)
          test -n "$WORLD_SERVER_URL" || (echo "WORLD_SERVER_URL is required" && exit 1)
          test -n "$CITY_ID" || (echo "CITY_ID is required" && exit 1)

      - name: Push blueprint to world server
        env:
          CITY_API_KEY: ${{ secrets.CITY_API_KEY }}
          WORLD_SERVER_URL: ${{ secrets.WORLD_SERVER_URL }}
          CITY_ID: ${{ secrets.CITY_ID }}
        run: |
          curl -fsSL \
            -X POST \
            -H "x-api-key: ${CITY_API_KEY}" \
            -H "content-type: application/json" \
            --data @blueprint.json \
            "${WORLD_SERVER_URL}/api/v1/cities/${CITY_ID}/push"

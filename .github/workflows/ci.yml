name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Generate contract artifacts
        run: npm run generate:types

      - name: Generate test-case traceability index
        run: npm run generate:test-index

      - name: Run Rust tests
        run: cargo test

      - name: Run workspace tests
        run: npm test
